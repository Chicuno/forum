services:
  postgres:
    image: postgres:16-alpine
    environment:
      - POSTGRES_DB=forum
      - POSTGRES_USER=forum
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U forum -d forum"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
    environment:
      - DB_URL=jdbc:postgresql://postgres:5432/forum
      - DB_USERNAME=forum
      - DB_PASSWORD=${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD in .env}
      - JWT_SECRET=${JWT_SECRET:?Define JWT_SECRET in .env}
      - SPRING_PROFILES_ACTIVE=demo
      - PORT=80
    ports:
      - "8080:80"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data: